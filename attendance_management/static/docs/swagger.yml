    delete:
      summary: Bulk delete records
      tags: [Attendance Records]
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: {type: array, items: {type: integer}}
      responses:
        200: {description: Success}

  /attendance-records/{id}:
    get:
      summary: Get record details
      tags: [Attendance Records]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: Success}
    put:
      summary: Update record
      tags: [Attendance Records]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttendanceRecord'}
      responses:
        200: {description: Success}
    delete:
      summary: Soft delete record
      tags: [Attendance Records]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: Success}

  /attendance-regularization:
    get:
      summary: List regularization requests
      tags: [Attendance Regularization]
      security: [{BearerAuth: []}]
      parameters:
        - name: search
          in: query
          schema: {type: string}
        - name: paginate
          in: query
          schema: {type: string, enum: ["true", "false"]}
      responses:
        200: {description: Success}
    post:
      summary: Create regularization request
      tags: [Attendance Regularization]
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttendanceRegularization'}
      responses:
        201: {description: Created}
    delete:
      summary: Bulk delete regularization
      tags: [Attendance Regularization]
      security: [{BearerAuth: []}]
      requestBody:
