      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttendancePolicy'}
      responses:
        200: {description: Success}
    delete:
      summary: Soft delete policy
      tags: [Attendance Policies]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: Success}

  /attendance-records:
    get:
      summary: List attendance records
      tags: [Attendance Records]
      security: [{BearerAuth: []}]
      parameters:
        - name: search
          in: query
          schema: {type: string}
        - name: paginate
