{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>HRMS Document Management API Docs</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@4.15.0/swagger-ui.css" />
</head>

<body>
    <div id="swagger-ui"></div>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@4.15.0/swagger-ui-bundle.js"></script>
    <script>
        const swaggerFile = "{% static 'docs/swagger.yml' %}?" + new Date().getTime();

        const ui = SwaggerUIBundle({
            url: swaggerFile,
            dom_id: '#swagger-ui',
            filter: true,
            syntaxHighlight: {
                activated: true,
                theme: 'arta'
            },
            presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIBundle.SwaggerUIStandalonePreset
            ],
        });
    </script>
</body>

</html>
