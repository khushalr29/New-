openapi: 3.0.0
info:
  title: HRMS Auth & User Service
  description: Comprehensive API documentation for the Human Resource Management System.
  version: "1.0.0"

servers:
  - url: /api/v1/auth
    description: Primary Auth Module Gateway

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: "Indicates if the operation was successful"
          example: true
        message:
          type: string
          description: "Summary message of the operation"
          example: "Operation successful"
        data:
          type: object
          nullable: true
          description: "Payload returned by the API"

