openapi: 3.0.3
info:
  title: Standalone Meeting Management API
  description: Professional Multi-tenant API. Log in to get your JWT access token.
  version: 1.0.0
  contact:
    name: API Support
    email: admin@gmail.com
servers:
  - url: http://localhost:8000/api/v1/
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, example: "admin@gmail.com"}
        password: {type: string, example: "123456"}

    LoginResponse:
      type: object
      properties:
        success: {type: boolean}
        tokens:
          type: object
          properties:
            refresh: {type: string}
            access: {type: string}

paths:
  /auth/login/:
    post:
      summary: Authenticate and get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /meetings/:
    get:
      summary: List meetings for user's company
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Success}
    post:
      summary: Create new meeting
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Created}

  /meetings/{id}/:
    get: {summary: Get meeting details}
    put: {summary: Update meeting (Full)}
    patch: {summary: Update meeting (Partial)}
    delete: {summary: Delete meeting}

  /meeting-rooms/:
    get: {summary: List available rooms}
    post: {summary: Create a room}

  /meeting-attendees/:
    get: {summary: List attendees}
    post: {summary: Register an attendee}

  /meeting-minutes/:
    get: {summary: Fetch minutes for company meetings}
    post: {summary: Record minutes}

  /action-items/:
    get: {summary: List follow-up tasks}
    post: {summary: Create task}
