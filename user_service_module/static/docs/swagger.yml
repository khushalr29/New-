openapi: 3.0.0
info:
  title: HRMS Auth & User Service
  description: Comprehensive API documentation for the Human Resource Management System.
  version: "1.0.0"

servers:
  - url: /api/v1/auth
    description: Primary Auth Module Gateway
  - url: /api/v1/company-employee
    description: Company & Employee Module Gateway

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: "Indicates if the operation was successful"
          example: true
        message:
          type: string
          description: "Summary message of the operation"
          example: "Operation successful"
        data:
          type: object
          nullable: true
          description: "Payload returned by the API"

    UserDetail:
      type: object
      properties:
        id: {type: integer, example: 123}
        full_name: {type: string, example: "John Doe"}
        email: {type: string, example: "john.doe@telepathy.com"}
        phone_number: {type: string, example: "+1234567890"}
        is_enabled: {type: boolean, example: true}
        company_id: {type: integer, example: 1}


    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company_name:
          type: string
          maxLength: 255
        company_code:
          type: string
          maxLength: 50
        company_type:
          type: integer
          description: Foreign key to CompanyType
        logo:
          type: string
          description: Base64 encoded logo or URL
        established_date:
          type: string
          format: date
          nullable: true
        about_company:
          type: string
        client_name:
          type: string
          maxLength: 100
        client_designation:
          type: string
          maxLength: 255
        country_number_code:
          type: integer
          default: 91
        client_number:
          type: string
          maxLength: 20
        client_email:
          type: string
          format: email
        client_gender:
          type: string
          enum: [Male, Female, Other]
          maxLength: 20
        website:
          type: string
          maxLength: 255
        address_line_1:
          type: string
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
        country:
          type: integer
          nullable: true
          description: Foreign key to Country
        state:
          type: integer
          nullable: true
          description: Foreign key to State
        city:
          type: integer
          nullable: true
          description: Foreign key to City
        pincode:
          type: string
          maxLength: 6
        no_of_floors:
          type: integer
          nullable: true
          minimum: 0
        no_of_blocks:
          type: integer
          nullable: true
          minimum: 0
        no_of_rooms:
          type: integer
          nullable: true
          minimum: 0
        special_features:
          type: string
        allow_plan_renewal_on_same_price:
          type: boolean
          default: true
        bill_me:
          type: string
          maxLength: 20
          default: Monthly
        plan_type:
          type: integer
          nullable: true
          description: Foreign key to Plan
        adds_on_services:
          type: string
          maxLength: 255
          nullable: true
        plan_activation_date:
          type: string
          format: date
          nullable: true
        subscription_end_date:
          type: string
          format: date
          nullable: true
        no_of_users:
          type: integer
          minimum: 0
        no_of_employees:
          type: integer
          minimum: 0
        payment_mode:
          type: string
          enum: [online, offline, cash, cheque, card]
          maxLength: 20
          default: online
        payment_status:
          type: string
          enum: [pending, completed, failed, refunded]
          maxLength: 20
        amount_paid:
          type: number
          format: decimal
          multipleOf: 0.01
        sub_domain:
          type: string
          maxLength: 255
        timezone:
          type: string
          maxLength: 100
          default: Asia/Kolkata
      required:
        - company_name
        - company_code
        - company_type
        - about_company
        - client_name
        - client_designation
        - client_number
        - client_email
        - client_gender
        - address_line_1
        - pincode
        - no_of_users
        - no_of_employees
        - payment_mode
        - payment_status
        - amount_paid
        - sub_domain

    CompanyList:
      allOf:
        - $ref: '#/components/schemas/Company'
        - type: object
          properties:
            created_at:
              type: string
              format: date-time
              readOnly: true
            updated_at:
              type: string
              format: date-time
              readOnly: true
            deleted_at:
              type: string
              format: date-time
              nullable: true
              readOnly: true

    CompanyInput:
      type: object
      properties:
        company_name: {type: string, maxLength: 255}
        company_code: {type: string, maxLength: 50}
        company_type: {type: integer}
        logo: {type: string}
        established_date: {type: string, format: date}
        about_company: {type: string}
        client_name: {type: string, maxLength: 100}
        client_designation: {type: string, maxLength: 255}
        country_number_code: {type: integer}
        client_number: {type: string, maxLength: 20}
        client_email: {type: string, format: email}
        client_gender: {type: string, enum: [Male, Female, Other]}
        website: {type: string}
        address_line_1: {type: string, maxLength: 255}
        address_line_2: {type: string, maxLength: 255}
        country: {type: integer}
        state: {type: integer}
        city: {type: integer}
        pincode: {type: string, maxLength: 6}
        no_of_floors: {type: integer, minimum: 0}
        no_of_blocks: {type: integer, minimum: 0}
        no_of_rooms: {type: integer, minimum: 0}
        special_features: {type: string}
        allow_plan_renewal_on_same_price: {type: boolean}
        bill_me: {type: string}
        plan_type: {type: integer}
        adds_on_services: {type: string}
        plan_activation_date: {type: string, format: date}
        subscription_end_date: {type: string, format: date}
        no_of_users: {type: integer, minimum: 0}
        no_of_employees: {type: integer, minimum: 0}
        payment_mode: {type: string, enum: [online, offline, cash, cheque, card]}
        payment_status: {type: string, enum: [pending, completed, failed, refunded]}
        amount_paid: {type: number, format: decimal}
        sub_domain: {type: string, maxLength: 255}
        timezone: {type: string}

    CompanyDetailResponse:
      type: object
      properties:
        success: {type: boolean, example: true}
        data: {$ref: '#/components/schemas/Company'}

    CompanyListResponse:
      type: object
      properties:
        success: {type: boolean, example: true}
        count: {type: integer}
        next: {type: string, format: uri, nullable: true}
        previous: {type: string, format: uri, nullable: true}
        results: {type: array, items: {$ref: '#/components/schemas/CompanyList'}}

    CompanyListUnpaginatedResponse:
      type: object
      properties:
        success: {type: boolean, example: true}
        data: {type: array, items: {$ref: '#/components/schemas/CompanyList'}}

    EmployeeCreate:
      type: object
      required: [full_name, personal_email_id, official_email_id, password]
      properties:
        full_name: {type: string}
        employee_id: {type: string}
        employee_code: {type: string}
        personal_email_id: {type: string, format: email}
        official_email_id: {type: string, format: email}
        password: {type: string, format: password}
        date_of_birth: {type: string, format: date}
        gender: {type: string, enum: ["Male", "Female", "Other"]}
        date_of_joining: {type: string, format: date}
        employment_type: {type: string, enum: ["full_time", "part_time", "contract", "intern"]}
        phone_number: {type: string}
        address: {type: string}

    EmployeeUpdate:
      type: object
      properties:
        full_name: {type: string}
        date_of_birth: {type: string}
        gender: {type: string}
        phone_number: {type: string}
        address: {type: string}

    EmployeeDetail:
      type: object
      properties:
        id: {type: integer}
        full_name: {type: string}
        employee_id: {type: string}
        employee_code: {type: string}
        email: {type: string}
        date_of_birth: {type: string, format: date}
        profile_image: {type: string}
        gender: {type: string}
        department: {type: object}
        designation: {type: object}
        date_of_joining: {type: string, format: date}
        status: {type: string}
        is_enabled: {type: boolean}

    EmployeeListResponse:
      type: array
      items: {$ref: '#/components/schemas/EmployeeDetail'}

    PaginatedEmployeeListResponse:
      type: object
      properties:
        count: {type: integer}
        next: {type: string, nullable: true}
        previous: {type: string, nullable: true}
        results: {type: array, items: {$ref: '#/components/schemas/EmployeeDetail'}}

    PlanCreate:
      type: object
      required: [plan_name, plan_price_inr, plan_price_usd, no_of_users, no_of_employees, description]
      properties:
        plan_name: {type: string}
        plan_price_inr: {type: number}
        plan_price_usd: {type: number}
        no_of_users: {type: integer}
        no_of_employees: {type: integer}
        payment_duration: {type: string}
        feature: {type: object}
        description: {type: string}
        visible_to_user: {type: boolean, default: true}
        permissions: {type: array, items: {type: integer}}

    PlanUpdate:
      type: object
      properties:
        plan_name: {type: string}
        plan_price_inr: {type: number}
        plan_price_usd: {type: number}
        no_of_users: {type: integer}
        no_of_employees: {type: integer}
        payment_duration: {type: string}
        feature: {type: object}
        description: {type: string}
        visible_to_user: {type: boolean}

    PlanDetail:
      type: object
      properties:
        id: {type: integer}
        plan_name: {type: string}
        plan_price_inr: {type: number}
        plan_price_usd: {type: number}
        no_of_users: {type: integer}
        no_of_employees: {type: integer}
        payment_duration: {type: string}
        feature: {type: object}
        description: {type: string}
        visible_to_user: {type: boolean}
        permissions: {type: array, items: {type: integer}}

    PlanListResponse:
      type: array
      items: {$ref: '#/components/schemas/PlanDetail'}

    SubscriptionDetail:
      type: object
      properties:
        id: {type: integer}
        company: {type: integer}
        plan_type: {type: integer}
        amount_paid: {type: number}
        plan_activation_date: {type: string, format: date}
        subscription_end_date: {type: string, format: date}
        payment_mode: {type: string}
        status: {type: string}
        transaction_ref_no: {type: string}
        remarks: {type: string}
        gateway: {type: string}

    PaginatedSubscriptionResponse:
      type: object
      properties:
        count: {type: integer}
        next: {type: string, nullable: true}
        previous: {type: string, nullable: true}
        results: {type: array, items: {$ref: '#/components/schemas/SubscriptionDetail'}}

    SubscriptionRenewRequest:
      type: object
      required: [company]
      properties:
        company: {type: integer}
        payment_mode: {type: string, enum: ["cash", "online", "upi", "bank_transfer"]}
        amount_paid: {type: number}
        remarks: {type: string}
        send_email: {type: boolean, default: true}

    SubscriptionUpgradeRequest:
      type: object
      required: [company, plan_id]
      properties:
        company: {type: integer}
        plan_id: {type: integer}
        amount_paid: {type: number}
        payment_mode: {type: string, enum: ["cash", "online"]}
        remarks: {type: string}
        send_email: {type: boolean, default: true}

    CreatePaymentRequest:
      type: object
      required: [company_id]
      properties:
        company_id: {type: integer}
        send_email: {type: boolean, default: true}

    PaymentLinkResponse:
      type: object
      properties:
        status: {type: string, example: success}
        message: {type: string}
        data:
          type: object
          properties:
            payment_link: {type: string}
            qr_code: {type: string}
            link_expiry_time: {type: string, format: date-time}

    RoleCreate:
      type: object
      required: [name]
      properties:
        name: {type: string}
        description: {type: string}
        permissions: {type: array, items: {type: integer}}

    RoleUpdate:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
        permissions: {type: array, items: {type: integer}}

    RoleDetail:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string}
        permissions: {type: array, items: {$ref: '#/components/schemas/PermissionDetail'}}

    RoleListResponse:
      type: array
      items: {$ref: '#/components/schemas/RoleListItem'}

    RoleListItem:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        description: {type: string}

    PermissionDetail:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        codename: {type: string}

    TokenRefresh:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
          description: "Your JWT refresh token"
          example: "your_refresh_token_here"

    SuccessResponse:
      type: object
      properties:
        success: {type: boolean, example: true}
        message: {type: string, example: Operation completed successfully}

    ErrorResponse:
      type: object
      properties:
        success: {type: boolean, example: false}
        message: {type: string}
        errors: {type: object, additionalProperties: true}

paths:
  /creates:
    post:
      summary: Create New User
      tags: [Users]
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserDetail'}
      responses:
        201: {description: Created}

  /updates/{id}:
    put:
      summary: Update User
      tags: [Users]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserDetail'}
      responses:
        200: {description: Updated}

  /details/{id}:
    get:
      summary: Get User Profile
      tags: [Users]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: Success}

  /profiles:
    get:
      summary: Get Current User Profile
      tags: [Users]
      security: [{BearerAuth: []}]
      responses:
        200: {description: Success}

  /lists:
    get:
      summary: List All Users
      tags: [Users]
      security: [{BearerAuth: []}]
      responses:
        200: {description: Success}

  /deletes:
    delete:
      summary: Bulk Delete Users
      tags: [Users]
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: {type: array, items: {type: integer}}
      responses:
        200: {description: Success}

  /status/{id}:
    patch:
      summary: Change User Status
      tags: [Users]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: Success}

  /enabled-users:
    get:
      summary: List Enabled Users
      tags: [Users]
      security: [{BearerAuth: []}]
      responses:
        200: {description: Success}

  /set-mpins:
    patch:
      summary: Set User MPIN
      tags: [Users]
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mpin]
              properties:
                mpin: {type: string, minLength: 6, maxLength: 6, example: "123456"}
      responses:
        200: {description: Success}

  /check-mpins:
    post:
      summary: Verify User MPIN
      tags: [Users]
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mpin]
              properties:
                mpin: {type: string, example: "123456"}
      responses:
        200: {description: Success}

  /logins:
    post:
      summary: User Authentication
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, company_id, host]
              properties:
                email: {type: string, example: "admin@telepathy.com"}
                password: {type: string, example: "secret123"}
                company_id: {type: integer, example: 1}
                host: {type: string, example: "telepathy.com"}
      responses:
        200: {description: Login Successful}

  /impersonation-logins:
    post:
      summary: SSO Impersonation
      tags: [Auth]
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Company_id]
              properties:
                Company_id: {type: integer, example: 1}
      responses:
        200: {description: Success}

  /refreshtokens:
    post:
      summary: Refresh JWT
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh:
                  type: string
                  description: "Your JWT refresh token"
                  example: "your_refresh_token_here"
      responses:
        200: {description: Success}

  /logouts:
    post:
      summary: User Logout
      tags: [Auth]
      security: [{BearerAuth: []}]
      responses:
        200: {description: Success}

  /send-reset-password-emails:
    post:
      summary: Request Password Reset
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, host]
              properties:
                email: {type: string, format: email, example: "admin@telepathy.com"}
                host: {type: string, example: "https://telepathy.com"}
      responses:
        200: {description: Success}

  /setpassword/{uid}/{token}:
    post:
      summary: Verify & Set Password
      tags: [Auth]
      parameters:
        - name: uid
          in: path
          required: true
          schema: {type: string}
        - name: token
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirm_password]
              properties:
                password: {type: string, format: password}
                confirm_password: {type: string, format: password}
      responses:
        200: {description: Success}

  /check-domains:
    get:
      summary: Verify Domain
      tags: [Auth]
      parameters:
        - name: domain
          in: query
          required: true
          schema: {type: string}
      responses:
        200: {description: Success}

  /verify-passwords:
    post:
      summary: Verify Password
      tags: [Auth]
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, format: password}
      responses:
        200: {description: Success}

  /all-permissions:
    get:
      summary: List Permissions
      tags: [Permissions]
      security: [{BearerAuth: []}]
      responses:
        200: {description: Success}

  /get-permissions/{id}:
    get:
      summary: Get Permission Detail
      tags: [Permissions]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: Success}

  /manage-permissions/{id}:
    post:
      summary: Update User Permissions
      tags: [Permissions]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: Success}

  /permissions/{id}:
    get:
      summary: Get User Permission List
      tags: [Permissions]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: Success}

  /groups-create:
    post:
      summary: Create Role
      tags: [Roles]
      security: [{BearerAuth: []}]
      responses:
        201: {description: Created}

  /groups-list:
    get:
      summary: List Roles
      tags: [Roles]
      security: [{BearerAuth: []}]
      responses:
        200: {description: Success}

  /groups-detail/{id}:
    get:
      summary: Get Role Detail
      tags: [Roles]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: Success}

  /groups-delete:
    delete:
      summary: Delete Role
      tags: [Roles]
      security: [{BearerAuth: []}]
      responses:
        200: {description: Success}

  /groups-permissions-update/{id}:
    post:
      summary: Map Permissions to Role
      tags: [Roles]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: Success}

  /manage-groups/{id}:
    post:
      summary: Assign Role to User
      tags: [Roles]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: Success}

  /groups-status-update/{id}:
    patch:
      summary: Toggle Role Status
      tags: [Roles]
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        200: {description: Success}

  /enabled-groups-list:
    get:
      summary: List Enabled Roles
      tags: [Roles]
      security: [{BearerAuth: []}]
      responses:
        200: {description: Success}

  /enums:
    get:
      summary: Global Enums
      tags: [System]
      responses:
        200: {description: Success}

  /session-user-types:
    get:
      summary: Session Metadata
      tags: [System]
      security: [{BearerAuth: []}]
      responses:
        200: {description: Success}

  /recent-actions:
    get:
      summary: Admin Audit Log
      tags: [System]
      security: [{BearerAuth: []}]
      responses:
        200: {description: Success}

  /companies:
    get:
      servers: [{url: /api/v1/company-employee}]
      tags: [Company]
      summary: List all companies
      security: [{BearerAuth: []}]
      parameters:
        - name: paginate
          in: query
          schema: {type: string, enum: [true, false], default: true}
      responses:
        '200': {description: Success}

    post:
      servers: [{url: /api/v1/company-employee}]
      tags: [Company]
      summary: Create a new company
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompanyInput'}
      responses:
        '201': {description: Success}

    delete:
      servers: [{url: /api/v1/company-employee}]
      tags: [Company]
      summary: Delete companies (bulk soft delete)
      security: [{BearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, items: {type: integer}}
      responses:
        '200': {description: Success}

  /companies/{id}:
    get:
      servers: [{url: /api/v1/company-employee}]
      tags: [Company]
      summary: Get company by ID
      security: [{BearerAuth: []}]
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
