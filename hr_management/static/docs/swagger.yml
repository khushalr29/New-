openapi: 3.0.0
info:
  title: HRMS Auth & User Service
  description: Comprehensive API documentation for the Human Resource Management System.
  version: "1.0.0"

servers:
  - url: /api/v1/auth
    description: Primary Auth Module Gateway
  - url: /api/v1/company-employee
    description: Company & Employee Module Gateway

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: "Indicates if the operation was successful"
          example: true
        message:
          type: string
          description: "Summary message of the operation"
          example: "Operation successful"
        data:
          type: object
          nullable: true
          description: "Payload returned by the API"

    AnnouncementCreate:
      type: object
      required:
        - title
        - category
        - content
        - start_date
        - end_date
      properties:
        title:
          type: string
          example: "Holiday Notice"
        category:
          type: string
          example: "GENERAL"
        short_description:
          type: string
          example: "Office will remain closed"
        content:
          type: string
          example: "Detailed announcement content"
        start_date:
          type: string
          format: date
          example: "2026-04-01"
        end_date:
          type: string
          format: date
          example: "2026-04-02"
        attachment:
          type: string
          format: binary
        is_featured_announcement:
          type: boolean
          example: false
        is_high_priority:
          type: boolean
          example: true
        is_company_wide_announcement:
          type: boolean
          example: true
        branch:
          type: array
          items:
            type: integer
          example: [1, 2]
        department:
          type: array
          items:
            type: integer
          example: [3, 4]

    AnnouncementResponse:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
        short_description:
          type: string
        content:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        attachment:
          type: string
        is_featured_announcement:
          type: boolean
        is_high_priority:
          type: boolean
        is_company_wide_announcement:
          type: boolean
        branch:
          type: array
          items:
            type: object
        department:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    AssetTypeCreate:
      type: object
      required:
        - asset_type_name
      properties:
        asset_type_name:
          type: string
          example: "Electronics"
        description:
          type: string
          example: "Electronic devices"

    AssetCreate:
      type: object
      required:
        - asset_name
        - asset_type
        - serial_number
        - asset_code
        - purchase_date
        - purchase_cost
        - status
        - condition
        - depreciation_method
        - useful_life
      properties:
        asset_name:
          type: string
          example: "Laptop Dell"
        asset_type:
          type: integer
          example: 1
        serial_number:
          type: string
          example: "SN123456"
        asset_code:
          type: string
          example: "AST001"
        purchase_date:
          type: string
          format: date
          example: "2026-04-01"
        purchase_cost:
          type: number
          format: decimal
          example: 50000
        status:
          type: string
          example: "ACTIVE"
        condition:
          type: string
          example: "NEW"
        description:
          type: string
        location:
          type: string
          example: "Delhi Office"
        supplier:
          type: string
          example: "Dell India"
        warranty_information:
          type: string
        warranty_expiry_date:
          type: string
          format: date
        image:
          type: string
          format: binary
        document:
          type: string
          format: binary
        depreciation_method:
          type: string
          example: "STRAIGHT_LINE"
        useful_life:
          type: integer
          example: 5
        salvage_value:
          type: number
          format: decimal
          example: 5000

    AssetResponse:
      type: object
      properties:
        id:
          type: integer
        asset_name:
          type: string
        asset_type:
          type: object
        serial_number:
          type: string
        asset_code:
          type: string
        purchase_date:
          type: string
          format: date
        purchase_cost:
          type: number
        status:
          type: string
        condition:
          type: string
        description:
          type: string
        location:
          type: string
        supplier:
          type: string
        warranty_information:
          type: string
        warranty_expiry_date:
          type: string
          format: date
        image:
          type: string
        document:
          type: string
        depreciation_method:
          type: string
        useful_life:
          type: integer
        salvage_value:
          type: number
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    AwardCreate:
      type: object
      required:
        - employee
        - award_type
        - date_awarded
      properties:
        employee:
          type: integer
          example: 1
        award_type:
          type: integer
          example: 2
        date_awarded:
          type: string
          format: date
          example: "2026-04-10"
        gift:
          type: string
          example: "Gold Medal"
        description:
          type: string
          example: "Best Employee of the Month"
        certificate:
          type: string
          format: binary
        photo:
          type: string
          format: binary

    AwardResponse:
      type: object
      properties:
        id:
          type: integer
        employee:
          type: integer
        award_type:
          type: object
        date_awarded:
          type: string
          format: date
        gift:
          type: string
        description:
          type: string
        certificate:
          type: string
        photo:
          type: string
        company:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    AwardTypeCreate:
      type: object
      required:
        - award_type
      properties:
        award_type:
          type: string
          example: "Best Performer"
        description:
          type: string
          example: "Award for best performing employee"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
          example: ACTIVE

    AwardTypeResponse:
      type: object
      properties:
        id:
          type: integer
        award_type:
          type: string
        description:
          type: string
        status:
          type: string
        company:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    BranchCreate:
      type: object
      required:
        - branch_name
        - branch_code
        - city
        - state
        - zip_code
        - country_code_number
        - phone_number
      properties:
        branch_name:
          type: string
          example: "Delhi Head Office"
        branch_code:
          type: string
          example: "DEL001"
        address:
          type: string
          example: "Connaught Place"
        city:
          type: string
          example: "Delhi"
        state:
          type: string
          example: "Delhi"
        zip_code:
          type: string
          example: "110001"
        country_code_number:
          type: string
          example: "+91"
        phone_number:
          type: string
          example: "9876543210"
        email:
          type: string
          example: "branch@example.com"
        status:
          type: string
          enum: [active, inactive]
          example: active
        created_by:
          type: integer
          example: 1

    BranchResponse:
      type: object
      properties:
        id:
          type: integer
        branch_name:
          type: string
        branch_code:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip_code:
          type: string
        country_code_number:
          type: string
        phone_number:
          type: string
        email:
          type: string
        status:
          type: string
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    ComplaintCreate:
      type: object
      required:
        - complainant
        - against_employee
        - complaint_type
        - subject
        - complaint_date
      properties:
        complainant:
          type: integer
          example: 1
        against_employee:
          type: integer
          example: 2
        complaint_type:
          type: string
          example: "HARASSMENT"
        subject:
          type: string
          example: "Workplace issue"
        complaint_date:
          type: string
          format: date
          example: "2026-04-15"
        description:
          type: string
        document:
          type: string
          format: binary
        status:
          type: string
          example: "OPEN"
        resolution_details:
          type: string
        resolved_by:
          type: integer
          example: 3
        is_submit_anonymously:
          type: boolean
          example: false

    ComplaintResponse:
      type: object
      properties:
        id:
          type: integer
        complainant:
          type: integer
        against_employee:
          type: integer
        complaint_type:
          type: string
        subject:
          type: string
        complaint_date:
          type: string
          format: date
        description:
          type: string
        document:
          type: string
        status:
          type: string
        resolution_details:
          type: string
        resolved_by:
          type: integer
        is_submit_anonymously:
          type: boolean
        company:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    DepartmentCreate:
      type: object
      required:
        - department
        - branch
        - unique_code
      properties:
        department:
          type: string
          example: "HR"
        branch:
          type: integer
          example: 1
        description:
          type: string
          example: "Human Resources Department"
        unique_code:
          type: string
          example: "HR001"
        parent:
          type: integer
          nullable: true
          example: null
        status:
          type: string
          enum: [active, inactive]
          example: active
        created_by:
          type: integer
          example: 1

    DepartmentResponse:
      type: object
      properties:
        id:
          type: integer
        branch:
          type: integer
        branch_name:
          type: string
        department:
          type: string
        description:
          type: string
        unique_code:
          type: string
        parent:
          type: integer
        status:
          type: string
        created_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    DesignationCreate:
      type: object
      required:
        - name
        - department
      properties:
        name:
          type: string
          example: Software Engineer
        department:
          type: integer
          example: 1
        status:
          type: string
          enum: [active, inactive]
          example: active

    DesignationUpdate:
      type: object
      properties:
        name:
          type: string
        department:
          type: integer
        status:
          type: string
          enum: [active, inactive]

    DesignationResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        department:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    DocumentTypeCreate:
      type: object
      required:
        - document_type
      properties:
        document_type:
          type: string
          example: Aadhaar Card
        description:
          type: string
          example: Government issued identity document
        status:
          type: string
          enum: [required, optional]
          example: required

    DocumentTypeUpdate:
      type: object
      properties:
        document_type:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [required, optional]

    DocumentTypeResponse:
      type: object
      properties:
        id:
          type: integer
        document_type:
          type: string
        description:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    EmployeeCreate:
      type: object
      required:
        - full_name
        - official_email_id
        - gender
      properties:
        full_name:
          type: string
          example: John Doe

        personal_email_id:
          type: string
          example: john@gmail.com

        official_email_id:
          type: string
          example: john@company.com

        password:
          type: string
          example: "123456"

        gender:
          type: string
          enum: [male, female, other]

        date_of_birth:
          type: string
          format: date

        branch:
          $ref: "#/components/schemas/Branch"

        department:
          $ref: "#/components/schemas/Department"

        designation:
          $ref: "#/components/schemas/Designation"

        shift:
          $ref: "#/components/schemas/Shift"

        attendence_policy:
          $ref: "#/components/schemas/AttendancePolicy"

        manager:
          type: integer
          example: 2

        phone_number:
          type: string
          example: "9876543210"

        status:
          type: string
          enum: [active, inactive]

        employee_documents:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeDocument"

    EmployeeUpdate:
      type: object
      properties:
        full_name:
          type: string
        official_email_id:
          type: string
        gender:
          type: string
        status:
          type: string
        phone_number:
          type: string

    EmployeeResponse:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string
        employee_id:
          type: string
        employee_code:
          type: string
        official_email_id:
          type: string
        gender:
          type: string
        phone_number:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time

    EmployeeDocument:
      type: object
      properties:
        document_type:
          type: integer
          example: 1
        document_file:
          type: string
          example: "base64/file/url"

    Branch:
      type: object
      properties:
        id:
          type: integer
          example: 1

    Department:
      type: object
      properties:
        id:
          type: integer
          example: 1

    Designation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Shift:
      type: object
      properties:
        id:
          type: integer
          example: 1

    AttendancePolicy:
      type: object
      properties:
        id:
          type: integer
          example: 1

    HolidayCreate:
      type: object
      required:
        - holiday_name
        - start_date
        - end_date
      properties:
        holiday_name:
          type: string
          example: Diwali

        category:
          type: string
          enum: [national, optional, festival]
          example: festival

        start_date:
          type: string
          format: date
          example: "2026-11-01"

        end_date:
          type: string
          format: date
          example: "2026-11-01"

        description:
          type: string
          example: Festival of lights

        is_paid_holiday:
          type: boolean
          example: true

        is_half_day:
          type: boolean
          example: false

        applicable_branches:
          type: array
          items:
            type: integer
          example: [1, 2]

        status:
          type: string
          enum: [active, inactive]
          example: active

    HolidayUpdate:
      type: object
      properties:
        holiday_name:
          type: string
        category:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        description:
          type: string
        is_paid_holiday:
          type: boolean
        is_half_day:
          type: boolean
        applicable_branches:
          type: array
          items:
            type: integer
        status:
          type: string

    HolidayResponse:
      type: object
      properties:
        id:
          type: integer
        holiday_name:
          type: string
        category:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        description:
          type: string
        is_paid_holiday:
          type: boolean
        is_half_day:
          type: boolean
        applicable_branches:
          type: array
          items:
            type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time

    IndicatorCategoryCreate:
      type: object
      required: [category_name]
      properties:
        category_name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive]

    IndicatorCreate:
      type: object
      required: [indicator_name, category]
      properties:
        indicator_name:
          type: string
        category:
          type: integer
        description:
          type: string
        measurement_unit:
          type: string
        target_value:
          type: number
        status:
          type: string
          enum: [active, inactive]

    GoalTypeCreate:
      type: object
      required: [goal_name]
      properties:
        goal_name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive]

    EmployeeGoalCreate:
      type: object
      required:
        - employee
        - goal_type
        - start_date
        - end_date
      properties:
        employee:
          type: integer
        goal_type:
          type: integer
        goal_title:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        target:
          type: string
        progress_percentage:
          type: number
        status:
          type: string
          enum: [PENDING, IN_PROGRESS, COMPLETED]

    ReviewCycleCreate:
      type: object
      required: [cycle_name, start_date, end_date]
      properties:
        cycle_name:
          type: string
        frequency:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY, ANNUAL]
        description:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
          enum: [active, inactive]

    EmployeeReviewCreate:
      type: object
      required:
        - employee
        - review_date
      properties:
        employee:
          type: integer
        reviewer:
          type: integer
        review_cycle:
          type: integer
        review_date:
          type: string
          format: date
        feedback:
          type: string
        rating:
          type: number
          example: 4.5
        status:
          type: string
          enum: [SCHEDULED, COMPLETED]

    PromotionCreate:
      type: object
      required:
        - employee
        - promotion_title
        - promotion_date
        - old_designation
        - new_designation
      properties:
        employee:
          type: integer
        promotion_title:
          type: string
        description:
          type: string
        promotion_date:
          type: string
          format: date
        old_designation:
          type: integer
        new_designation:
          type: integer
        salary_adjustment:
          type: number
          format: decimal
        reason_for_promotion:
          type: string
        document:
          type: string
          description: File or base64 string
        status:
          type: string
          enum: [pending, approved, rejected]

    Employee:
      type: object
      properties:
        id:
          type: integer
        full_name:
          type: string

    PromotionList:
      type: object
      properties:
        id:
          type: integer
        employee:
          $ref: '#/components/schemas/Employee'
        promotion_title:
          type: string
        description:
          type: string
        promotion_date:
          type: string
          format: date
        old_designation:
          $ref: '#/components/schemas/Designation'
        new_designation:
          $ref: '#/components/schemas/Designation'
        salary_adjustment:
          type: number
        reason_for_promotion:
          type: string
        document:
          type: string
        status:
          type: string
        company:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    ResignationCreate:
      type: object
      required:
        - employee
        - resignation_date
        - last_working_day
        - resignation_reason
      properties:
        employee:
          type: integer
        resignation_date:
          type: string
          format: date
        last_working_day:
          type: string
          format: date
        notice_period:
          type: string
        resignation_reason:
          type: string
        description:
          type: string
        document:
          type: string
          description: File or base64 string
        status:
          type: string
          enum: [active, inactive]

    ResignationList:
      type: object
      properties:
        id:
          type: integer
        employee:
          $ref: '#/components/schemas/Employee'
        resignation_date:
          type: string
          format: date
        last_working_day:
          type: string
          format: date
        notice_period:
          type: string
        resignation_reason:
          type: string
        description:
          type: string
        document:
          type: string
        status:
          type: string
        company:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true

    TerminationCreate:
      type: object
      required:
        - employee
        - termination_type
        - termination_date
        - last_working_day
        - termination_reason
      properties:
        employee:
          type: integer
        termination_type:
          type: string
          enum: [voluntary, involuntary, retirement, contract_end]
        termination_date:
          type: string
          format: date
        last_working_day:
          type: string
          format: date
        termination_reason:
          type: string
        description:
          type: string
        document:
          type: string
          description: File or base64 string
        status:
          type: string
          enum: [active, inactive]
        exit_interview_conducted:
          type: boolean
        exit_interview_date:
          type: string
          format: date
          nullable: true
        exit_feedback:
          type: string

    TerminationList:
      type: object
      properties:
        id:
          type: integer
        employee:
          $ref: '#/components/schemas/Employee'
        termination_type:
          type: string
        termination_date:
          type: string
          format: date
        last_working_day:
          type: string
          format: date
        termination_reason:
          type: string
        description:
          type: string
        document:
          type: string
        status:
          type: string
        exit_interview_conducted:
          type: boolean
        exit_interview_date:
          type: string
          format: date
          nullable: true
        exit_feedback:
          type: string
        company:
          type: integer
        created_at:
